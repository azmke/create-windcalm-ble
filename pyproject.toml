[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "create-windcalm-ble"
version = "0.2.0"
description = "Control a CREATE WIND CALM ceiling fan over Bluetooth LE (Tuya BLE protocol)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "WindCalm BLE contributors" }]
keywords = ["tuya", "ble", "ceiling-fan", "windcalm", "bluetooth"]

dependencies = [
    "bleak>=0.22",
    "pycryptodome>=3.20",
    "python-dotenv>=1.0",
]

[project.scripts]
windcalm = "create_windcalm_ble.cli:main"

[tool.setuptools]
package-dir = {"" = "custom_components/create_windcalm_ble"}

[tool.setuptools.packages.find]
where = ["custom_components/create_windcalm_ble"]
include = ["create_windcalm_ble*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
